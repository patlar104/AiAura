# AiAura CI — required build checks (JVM, Android, JS, Wasm) + tests + lint
# Matches PROJECT_RULES.md §5 and pre-merge checklist.
# Not run in CI (require macOS or display): iOS build, Desktop run.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: 36.0.0

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile JVM
        run: ./gradlew :composeApp:compileKotlinJvm --no-daemon

      - name: Compile JS (web target)
        run: ./gradlew :composeApp:compileKotlinJs --no-daemon

      - name: Compile Wasm (web target)
        run: ./gradlew :composeApp:compileKotlinWasmJs --no-daemon

      - name: Run JVM tests
        run: ./gradlew :composeApp:jvmTest --no-daemon

      - name: Run JS tests
        run: ./gradlew :composeApp:jsTest --no-daemon

      - name: Run Wasm tests
        run: ./gradlew :composeApp:wasmJsTest --no-daemon

      - name: Build Android debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon

      - name: Android lint
        run: ./gradlew :composeApp:lintDebug --no-daemon
